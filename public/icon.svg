<svg width="180" height="180" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
  <!--
    Marca de Contraste: la "O" del wordmark, un círculo con la mitad derecha
    sólida. Es el concepto de contraste hecho forma y la única parte del logo
    que funciona sola a 16px.

    El anterior era el logo de v0, el que venía con la plantilla del proyecto.

    El fondo se queda negro en los dos esquemas a propósito: el verde ácido
    sobre negro es la combinación de la marca, y en modo claro un icono oscuro
    se recorta mejor contra las pestañas del navegador que uno claro.
  -->
  <rect width="180" height="180" rx="38" fill="#08080a" />
  <g transform="translate(90 90)">
    <circle r="52" fill="none" stroke="#c8ff00" stroke-width="13" />
    <path d="M0 -52a52 52 0 0 1 0 104z" fill="#c8ff00" />
  </g>
</svg>
